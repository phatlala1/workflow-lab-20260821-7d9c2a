name: private-fork-pr-push-semantics

on:
  push:
    branches:
      - private-validation/fork-pr-push-semantics-20260911
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reproduce exact fork checkout and origin push behavior
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: "2"
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fork-pr-semantics"
          mkdir -p "$evidence"

          base_repo="$GITHUB_REPOSITORY"
          before_origin=$(git remote get-url origin)
          before_branch=$(git rev-parse --abbrev-ref HEAD)
          pr_json=$(gh pr view "$PR_NUMBER" --json number,state,headRefName,headRepository,baseRefName,headRefOid)
          printf '%s\n' "$pr_json" > "$evidence/pr-before.json"

          head_repo=$(printf '%s' "$pr_json" | jq -r '.headRepository.nameWithOwner')
          head_branch=$(printf '%s' "$pr_json" | jq -r '.headRefName')
          head_sha=$(printf '%s' "$pr_json" | jq -r '.headRefOid')
          test "$head_repo" != "$base_repo"
          test "$head_branch" = "patched-control-7d9c2a"

          # Exact command used by the target workflow.
          gh pr checkout "$PR_NUMBER"

          checkout_branch=$(git rev-parse --abbrev-ref HEAD)
          checkout_sha=$(git rev-parse HEAD)
          after_origin=$(git remote get-url origin)
          git remote -v > "$evidence/remotes.txt"
          git config --get-regexp '^branch\.' > "$evidence/branch-config.txt" || true

          test "$checkout_branch" = "$head_branch"
          test "$checkout_sha" = "$head_sha"
          test "$after_origin" = "$before_origin"

          base_before=$(git ls-remote --heads origin "refs/heads/$checkout_branch" | awk '{print $1}')
          test -z "$base_before"

          marker_dir="fork-pr-push-semantics"
          marker_file="$marker_dir/run-${GITHUB_RUN_ID}.txt"
          mkdir -p "$marker_dir"
          cat > "$marker_file" <<MARKER
          AUTHORIZED_DISPOSABLE_FORK_PUSH_PROOF
          run_id=$GITHUB_RUN_ID
          source_pr=$PR_NUMBER
          source_head_repository=$head_repo
          source_head_branch=$head_branch
          source_head_sha=$head_sha
          checkout_origin=$after_origin
          MARKER

          git config user.name "Authorized Workflow Lab"
          git config user.email "workflow-lab@users.noreply.github.com"
          git add "$marker_file"
          git commit -m "Authorized lab: prove fork checkout pushes to base origin [skip ci]"
          proof_commit=$(git rev-parse HEAD)

          # Exact push shape used by the target workflow.
          git push origin "HEAD:$checkout_branch"

          base_after=$(git ls-remote --heads origin "refs/heads/$checkout_branch" | awk '{print $1}')
          test "$base_after" = "$proof_commit"

          fork_after=$(git ls-remote "https://github.com/$head_repo.git" "refs/heads/$head_branch" | awk '{print $1}')
          test "$fork_after" = "$head_sha"
          test "$fork_after" != "$base_after"

          cat > "$evidence/final.json" <<JSON
          {
            "schema": "authorized-fork-pr-base-push-semantics-1",
            "runId": "$GITHUB_RUN_ID",
            "baseRepository": "$base_repo",
            "sourcePullRequest": $PR_NUMBER,
            "sourcePullRequestState": "open",
            "sourceHeadRepository": "$head_repo",
            "sourceHeadBranch": "$head_branch",
            "sourceHeadSha": "$head_sha",
            "checkoutBranch": "$checkout_branch",
            "checkoutShaBeforeProof": "$checkout_sha",
            "originBeforeCheckout": "$before_origin",
            "originAfterCheckout": "$after_origin",
            "baseBranchAbsentBefore": true,
            "exactPushCommandShape": "git push origin HEAD:<checkout-branch>",
            "baseBranchCreated": true,
            "baseBranchProofCommit": "$base_after",
            "forkBranchUnchanged": true,
            "forkBranchShaAfter": "$fork_after",
            "contentsWritePermission": true,
            "classification": "FORK_PR_CHECKOUT_PUSHES_ATTESTED_CONTENT_TO_BASE_REPOSITORY_BRANCH"
          }
          JSON

          cat "$evidence/final.json"
          {
            echo '## Authorized disposable fork PR push proof'
            echo
            echo '```json'
            cat "$evidence/final.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
